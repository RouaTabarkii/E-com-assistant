services:
  db:
    image: postgres:16
    container_name: olistiq_db
    environment:
      POSTGRES_USER: olistiq
      POSTGRES_PASSWORD: olistiq
      POSTGRES_DB: olistiq
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olistiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: olistiq_app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app


  qdrant:
    image: qdrant/qdrant:latest
    container_name: olistiq_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: