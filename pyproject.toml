[project]
name = "olistiq"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "langchain-text-splitters>=0.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

